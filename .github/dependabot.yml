version: 2
# Wait 7 days before proposing updates to newly published versions, so a
# compromised/unstable release has time to be caught and yanked.
updates:
- package-ecosystem: npm
  directory: /
  labels:
    - ⬆️⬇️ dependencies
  schedule:
    interval: weekly
  commit-message:
    prefix: ⬆️
  cooldown:
    default-days: 7
- package-ecosystem: nuget
  directory: /
  labels:
    - ⬆️⬇️ dependencies
  schedule:
    interval: weekly
  commit-message:
    prefix: ⬆️
  cooldown:
    default-days: 7
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  commit-message:
    prefix: ⬆️👷
  labels:
    - ⬆️⬇️ dependencies
  cooldown:
    default-days: 7
