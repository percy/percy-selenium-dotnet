name: Release
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - uses: actions/setup-dotnet@55ec9447dda3d1cf6bd587150f3262f30ee10815 # v3.4.2
        with:
          dotnet-version: 6.0.x
      - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}/nuget-6.0.x/${{ hashFiles('**/packages.lock.json') }}
          restore-keys: ${{ runner.os }}/nuget-6.0.x/
      - name: Install OpenSSL 1.1
        run: |
          wget -q https://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb
          echo "7cf39d70a639017d1dd7c8d36daa2258063608688e449fddf40ffdd46f992a78  libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb" | sha256sum -c -
          sudo dpkg -i libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb
      - name: Install Dependencies
        run: dotnet restore
      - name: Build Package
        run: dotnet build --configuration Release --no-restore Percy
      - name: Create Package
        run: dotnet pack --configuration Release Percy
      - name: Publish Package
        # `dotnet nuget push` only accepts the API key as a command-line
        # argument on Linux (nuget.config apikeys need Windows encryption), so
        # push through the NuGet publish endpoint directly. The key is written
        # to a private header file by a shell builtin and read by curl, so it
        # never appears in any process's argument list.
        run: |
          umask 077
          header_file="$(mktemp)"
          trap 'rm -f "$header_file"' EXIT
          printf 'X-NuGet-ApiKey: %s\n' "$NUGET_TOKEN" > "$header_file"
          for package in */bin/Release/*.nupkg; do
            echo "Pushing $package"
            curl --fail-with-body --silent --show-error -X PUT \
              -H "@$header_file" \
              -F "package=@$package" \
              "$NUGET_PUBLISH_URL"
          done
        env:
          # PackagePublish/2.0.0 resource from https://api.nuget.org/v3/index.json
          NUGET_PUBLISH_URL: https://www.nuget.org/api/v2/package
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
